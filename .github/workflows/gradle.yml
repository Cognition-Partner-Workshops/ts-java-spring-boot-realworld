name: Java CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Backend (JDK 21 / Gradle)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up Gradle (with caching)
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - name: Build, test, format check and coverage gate
      run: ./gradlew clean test spotlessCheck jacocoTestReport jacocoTestCoverageVerification
    - name: Upload JUnit reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-reports
        path: |
          build/reports/tests/test
          build/test-results/test
        if-no-files-found: warn
    - name: Upload JaCoCo reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-reports
        path: build/reports/jacoco/test
        if-no-files-found: warn

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install
      run: npm ci
    - name: Lint
      continue-on-error: false
      run: npm run lint
    - name: Typecheck
      continue-on-error: false
      run: npm run typecheck
    - name: Test
      continue-on-error: false
      run: npm test
    - name: Build
      continue-on-error: false
      run: npm run build
    - name: Upload frontend coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: frontend/coverage
        if-no-files-found: ignore
